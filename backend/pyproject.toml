[project]
name = "engineering-intelligence-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "redis>=5.2,<7", "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "fakeredis[lua]>=2.26,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
