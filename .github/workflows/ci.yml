name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eip_test
          POSTGRES_USER: eip
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U eip -d eip_test" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      EIP_TEST_DATABASE_URL: postgresql+asyncpg://eip:ci-test-only@localhost:5432/eip_test
      EIP_TEST_REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/api/v1/health/ready
      - run: curl --fail http://localhost:3000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -g "real registration" --project desktop
        working-directory: frontend
        env:
          EIP_E2E_REAL_AUTH: '1'
          EIP_EXTERNAL_WEB_SERVER: '1'
      - if: always()
        run: docker compose down
